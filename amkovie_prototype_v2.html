<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMKOVie — Prototype fonctionnel V2</title>
<style>
:root{--g:#087a5b;--g2:#0e9b73;--ink:#17312b;--muted:#64756f;--bg:#f4faf7;--card:#fff;--line:#dceae5;--soft:#e7f6ef;--warn:#fff6df;--warnink:#75550a;--danger:#fff0ef;--dangerink:#8c2018;--blue:#eaf4ff;--blueink:#1e5d92}
*{box-sizing:border-box}body{margin:0;background:#dfe9e5;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select{font:inherit}.app{width:min(430px,100vw);height:100vh;min-height:760px;margin:auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 30px #0002}.status{height:30px;padding:7px 18px 0;font-size:12px;display:flex;justify-content:space-between}.screen{flex:1;overflow:auto;padding:18px 18px 92px}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.title{font-size:24px;font-weight:850}.h1{font-size:28px;font-weight:850;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.logo{font-size:34px;font-weight:900;letter-spacing:-1.8px;color:var(--g)}.hero{text-align:center;padding:42px 20px}.leaf{font-size:54px}.tag{display:inline-block;background:var(--soft);color:var(--g);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--g);color:#fff;font-weight:800;font-size:15px;margin-top:11px;cursor:pointer}.btn.secondary{background:#fff;color:var(--g);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--g);padding:10px}.btn.danger{background:var(--danger);color:var(--dangerink)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #0c5c4510}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border-radius:15px;background:#fff;border:1px solid var(--line)}.metric b{display:block;font-size:20px;margin-top:4px}.small{font-size:12px;color:var(--muted)}.bar{height:7px;border-radius:20px;background:#e3eee9;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--g);width:60%}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px}.search{display:flex;gap:8px}.search input,input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;font-size:14px}.plant{overflow:hidden;padding:0}.pic{height:115px;background:linear-gradient(135deg,#d7ead5,#edf6e8);display:flex;align-items:center;justify-content:center;font-size:54px}.plant .body{padding:14px}.tabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);margin:0 -14px;padding:0 14px}.tabs button{border:0;background:transparent;padding:12px 8px;color:var(--muted);white-space:nowrap}.tabs button.active{color:var(--g);font-weight:800;border-bottom:2px solid var(--g)}.notice,.warning,.dangerbox,.info{border-radius:14px;padding:13px;font-size:13px;line-height:1.45}.notice{background:var(--soft);color:#155c48}.warning{background:var(--warn);color:var(--warnink);border:1px solid #f1dda8}.dangerbox{background:var(--danger);color:var(--dangerink);border:1px solid #f1c2be}.info{background:var(--blue);color:var(--blueink)}.nav{height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);position:absolute;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;color:#687a74;font-size:10px;cursor:pointer}.nav button.active{color:var(--g);font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}.fab{position:absolute;right:16px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#fff;font-weight:900;box-shadow:0 8px 22px #087a5b55;cursor:pointer}.avatar{width:50px;height:50px;border-radius:50%;background:#d9ece5;display:grid;place-items:center;font-size:23px}.list{display:flex;gap:12px;align-items:center}.option{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff}.check{accent-color:var(--g)}.modal{position:absolute;inset:0;background:#10201b66;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:86%;overflow:auto}.close{border:0;background:#eef5f2;border-radius:50%;width:34px;height:34px;cursor:pointer}.step{height:6px;background:#e2ece8;border-radius:20px;overflow:hidden;margin:10px 0 18px}.step i{display:block;height:100%;background:var(--g);width:25%}.back{border:0;background:transparent;font-size:25px;color:var(--ink);cursor:pointer}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.pill-ok{display:inline-block;background:#e8f6ef;color:#087a5b;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pill-pending{display:inline-block;background:#fff6df;color:#75550a;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.footer-note{font-size:11px;color:var(--muted);text-align:center;margin:18px 4px}
</style>
</head>
<body>
<div class="app">
<div class="status"><span>9:41</span><span>▮▮▮　Wi‑Fi　▰</span></div>
<div id="screen" class="screen"></div>
<button id="fab" class="fab" onclick="openAI()">AI</button>
<nav class="nav">
<button onclick="go('home')" data-nav="home"><span>⌂</span>Accueil</button>
<button onclick="go('health')" data-nav="health"><span>♡</span>Santé</button>
<button onclick="go('nature')" data-nav="nature"><span>♧</span>Nature</button>
<button onclick="go('wellness')" data-nav="wellness"><span>✧</span>Bien-être</button>
<button onclick="go('profile')" data-nav="profile"><span>♙</span>Profil</button>
</nav>
<div id="modal" class="modal hidden"></div>
</div>
<script>
const S=document.getElementById('screen');
const state={consent:false,meds:null,allergy:null,special:null,country:'Togo',lang:'Français',booking:false};
function nav(active){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===active))}
function go(page){document.getElementById('fab').style.display=['splash','welcome','onboard','consent'].includes(page)?'none':'block';const p={splash,welcome,onboard,consent,home,health,nature,plant,safety,safetyResult,wellness,professionals,professional,booking,profile,privacy,proLogin,proDashboard,admin,education};(p[page]||home)()}
function base(html,active='home'){S.innerHTML=html;nav(active)}
function splash(){nav('');S.innerHTML=`<div class="hero"><div class="leaf">🌿</div><div class="logo">AMKOVie</div><h2>Your Health.<br>Your Well-being.<br>Your Life.</h2><p class="sub">Connecting modern health, natural care & wellness.</p><button class="btn" onclick="go('welcome')">Commencer</button><p class="footer-note">Prototype fonctionnel V2 · informations de démonstration</p></div>`}
function welcome(){S.innerHTML=`<div class="hero"><span class="tag">Plateforme santé préventive & intégrative</span><h1>Bienvenue sur AMKOVie</h1><p class="sub">Comprendre, suivre et mieux organiser votre santé et votre bien-être.</p><div class="grid" style="margin-top:24px"><div class="card">🛡️<br><b>Prévention</b><br><span class="small">Habitudes et suivi</span></div><div class="card">🌿<br><b>Nature</b><br><span class="small">Données structurées</span></div><div class="card">🥗<br><b>Nutrition</b><br><span class="small">Éducation</span></div><div class="card">🤲<br><b>Bien-être</b><br><span class="small">Massage & relaxation</span></div></div><button class="btn" onclick="go('onboard')">Créer mon profil</button><button class="btn secondary" onclick="go('home')">Continuer en invité</button></div>`}
function onboard(){S.innerHTML=`<div class="top"><button class="back" onclick="go('welcome')">‹</button><span class="small">1 / 3</span></div><div class="step"><i style="width:33%"></i></div><div class="h1">Vos objectifs</div><p class="sub">Sélectionnez ce que vous souhaitez suivre.</p>${['Prévention générale','Alimentation / Nutrition','Sommeil','Activité physique','Santé naturelle','Bien-être'].map((x,i)=>`<label class="option"><span>${x}</span><input class="check" type="checkbox" ${[0,1,4].includes(i)?'checked':''}></label>`).join('')}<button class="btn" onclick="go('consent')">Continuer</button>`}
function consent(){S.innerHTML=`<div class="top"><button class="back" onclick="go('onboard')">‹</button><span class="small">3 / 3</span></div><div class="step"><i style="width:100%"></i></div><div class="h1">Votre sécurité et vos données</div><div class="notice"><b>AMKOVie accompagne, mais ne remplace pas un professionnel de santé.</b><br>Les informations santé doivent être utilisées avec prudence et selon les règles applicables dans votre pays.</div><div class="card"><label class="option"><span>J'accepte les conditions d'utilisation</span><input id="c1" class="check" type="checkbox"></label><label class="option"><span>J'accepte le traitement de mes données nécessaires au service</span><input id="c2" class="check" type="checkbox"></label></div><button class="btn" onclick="acceptConsent()">Continuer vers AMKOVie</button><button class="btn secondary" onclick="go('privacy')">Lire confidentialité</button>`}
function acceptConsent(){state.consent=true;go('home')}
function home(){base(`<div class="top"><div><div class="title">Bonjour 👋</div><div class="sub">Comment allez-vous aujourd'hui ?</div></div><div class="avatar">🙂</div></div><div class="chips"><span class="chip">😊 Très bien</span><span class="chip">🙂 Bien</span><span class="chip">😐 Moyen</span><span class="chip">😟 Pas très bien</span></div><h3>Mon jour</h3><div class="grid"><div class="metric">💧 Hydratation<b>4 / 8</b><span class="small">objectif personnel</span><div class="bar"><i style="width:50%"></i></div></div><div class="metric">😴 Sommeil<b>7 h 12</b><span class="small">donnée enregistrée</span><div class="bar"><i style="width:78%"></i></div></div><div class="metric">🚶 Activité<b>5 240</b><span class="small">pas</span><div class="bar"><i style="width:62%"></i></div></div><div class="metric">🧘 Bien-être<b>10 min</b><span class="small">relaxation</span><div class="bar"><i style="width:50%"></i></div></div></div><div class="card"><b>🌿 Recommandation du jour</b><p class="sub">Explorez une fiche structurée avec usage traditionnel, données disponibles et précautions.</p><button class="btn" onclick="go('nature')">Explorer</button></div><div class="card"><b>📚 Apprendre</b><p class="sub">Des contenus santé avec auteur, sources et date de révision.</p><button class="btn secondary" onclick="go('education')">Ouvrir l'éducation santé</button></div>`,`home`)}
function health(){base(`<div class="top"><div><div class="title">♡ Ma santé</div><div class="sub">Suivi personnel, sans diagnostic automatique</div></div></div><div class="card"><h3>Mes objectifs</h3><p>💧 Hydratation</p><div class="bar"><i style="width:65%"></i></div><p>😴 Sommeil</p><div class="bar"><i style="width:72%"></i></div><p>🚶 Activité</p><div class="bar"><i style="width:48%"></i></div></div><div class="grid"><div class="card"><b>📈 Évolution</b><p class="small">7 jours · 30 jours · 3 mois</p><button class="btn secondary">Voir</button></div><div class="card"><b>🎯 Objectifs</b><p class="small">Modifier mes objectifs</p><button class="btn secondary">Modifier</button></div></div><div class="warning">Les indicateurs de suivi ne constituent pas à eux seuls un diagnostic médical.</div>`,`health`)}
function nature(){base(`<div class="top"><div><div class="title">🌿 Santé naturelle</div><div class="sub">Tradition, science et sécurité séparées</div></div></div><div class="search"><input id="plantSearch" placeholder="Rechercher une plante..." oninput="filterPlants()"><button class="btn" style="width:52px;margin:0" onclick="go('plant')">⌕</button></div><div class="chips" style="margin-top:12px"><span class="chip">Plantes</span><span class="chip">Nutrition</span><span class="chip">Préparations</span><span class="chip">Traditions</span><span class="chip">Sécurité</span></div><div class="notice">Chaque fiche doit indiquer ses sources, son niveau de preuve, ses précautions et sa date de révision.</div><h3>Bibliothèque</h3><div id="plants" class="grid">${plantCards()}</div>`,`nature`)}
function plantCards(){return [['🌿','Moringa','Moringa oleifera'],['🍃','Neem','Azadirachta indica'],['🫚','Gingembre','Zingiber officinale'],['🟠','Curcuma','Curcuma longa']].map(p=>`<div class="card plant" data-name="${p[1].toLowerCase()} ${p[2].toLowerCase()}" onclick="go('plant')"><div class="pic">${p[0]}</div><div class="body"><b>${p[1]}</b><div class="small">${p[2]}</div><br><span class="pill-pending">Révision scientifique</span></div></div>`).join('')}
function filterPlants(){const q=document.getElementById('plantSearch').value.toLowerCase();document.querySelectorAll('#plants .plant').forEach(x=>x.style.display=x.dataset.name.includes(q)?'block':'none')}
function plant(){base(`<div class="top"><button class="back" onclick="go('nature')">‹</button><button class="close">♡</button></div><div class="card plant"><div class="pic">🌿</div><div class="body"><h1 style="margin:0">Moringa</h1><i>Moringa oleifera</i><p><span class="pill-pending">Niveau de preuve à valider</span></p><div class="tabs"><button class="active">Vue d'ensemble</button><button>Tradition</button><button>Science</button><button>Sécurité</button></div><h3>Identité</h3><p class="sub">Nom scientifique : Moringa oleifera<br>Nom courant : Moringa<br>Parties étudiées : à renseigner par le dossier scientifique</p><div class="warning"><b>Usage traditionnel</b><br>Les usages traditionnellement rapportés sont présentés séparément des conclusions scientifiques.</div><h3>Données scientifiques</h3><p class="sub">En production : références, type d'étude, population, résultats, limites et niveau de confiance.</p><h3>Traçabilité</h3><p class="small">Source · Réviseur · Version · Date de révision</p><button class="btn" onclick="go('safety')">Vérifier la sécurité</button></div></div>`,`nature`)}
function safety(){base(`<div class="top"><button class="back" onclick="go('plant')">‹</button><span class="small">AMKOVie SAFE</span></div><div class="h1">⚠️ Vérification de sécurité</div><p class="sub">Répondez uniquement si vous souhaitez personnaliser l'information. Ne saisissez pas ici de données inutiles.</p><div class="card"><b>Prenez-vous actuellement des médicaments ?</b><div class="grid"><button class="btn secondary" onclick="setSafety('meds','yes')">Oui</button><button class="btn" onclick="setSafety('meds','no')">Non</button></div></div><div class="card"><b>Avez-vous une allergie connue ?</b><div class="grid"><button class="btn secondary" onclick="setSafety('allergy','yes')">Oui</button><button class="btn" onclick="setSafety('allergy','no')">Non</button></div></div><div class="card"><b>Grossesse / allaitement ou autre situation particulière ?</b><div class="grid"><button class="btn secondary" onclick="setSafety('special','yes')">Oui</button><button class="btn" onclick="setSafety('special','no')">Non / non concerné</button></div></div><button class="btn" onclick="safetyCheck()">Analyser la sécurité</button><div class="footer-note">Le moteur de sécurité réel devra être alimenté par des sources validées et des règles pays.</div>`,`nature`)}
function setSafety(k,v){state[k]=v}
function safetyCheck(){const risk=state.meds==='yes'||state.allergy==='yes'||state.special==='yes';go(risk?'safetyResult':'safetyResult')}
function safetyResult(){const risk=state.meds==='yes'||state.allergy==='yes'||state.special==='yes';base(`<div class="top"><button class="back" onclick="go('safety')">‹</button><span class="small">Résultat</span></div><div class="h1">${risk?'⚠️ Prudence requise':'ℹ️ Information générale'}</div><div class="${risk?'dangerbox':'notice'}">${risk?'Votre situation déclarée peut nécessiter une vérification professionnelle avant toute utilisation. AMKOVie ne doit pas fournir ici une recommandation autonome.':'Aucune situation particulière n’a été déclarée dans ce prototype. Cela ne signifie pas qu’une utilisation est automatiquement sûre.'}</div><div class="card"><b>Prochaine étape</b><p class="sub">En production, AMKOVie SAFE vérifiera les interactions, contre-indications, populations particulières, niveau de preuve et réglementation applicable.</p></div>${risk?'<button class="btn" onclick="go(\'professionals\')">Trouver un professionnel</button>':''}<button class="btn secondary" onclick="go('plant')">Retour à la fiche</button>`,`nature`)}
function wellness(){base(`<div class="top"><div><div class="title">🤲 Bien-être</div><div class="sub">Massage, relaxation et habitudes de bien-être</div></div></div><div class="card" style="background:linear-gradient(135deg,#e7f5ef,#fff)"><h2>Massage & soins complémentaires</h2><p class="sub">Les services affichés doivent respecter les règles professionnelles applicables dans le pays concerné.</p><button class="btn" onclick="go('professionals')">Trouver un professionnel</button></div><div class="grid"><div class="card">🧘<br><b>Relaxation</b><br><span class="small">Détente</span></div><div class="card">🌬️<br><b>Respiration</b><br><span class="small">Exercices</span></div><div class="card">🤲<br><b>Massage</b><br><span class="small">Bien-être</span></div><div class="card">🏃<br><b>Récupération</b><br><span class="small">Après effort</span></div></div><div class="card"><b>Réserver</b><p class="sub">Choisissez un service, un professionnel et une disponibilité confirmée.</p><button class="btn secondary" onclick="go('booking')">Réserver une séance</button></div>`,`wellness`)}
function professionals(){base(`<div class="top"><div><div class="title">Professionnels</div><div class="sub">Profils soumis aux contrôles définis par AMKOVie.</div></div></div><input placeholder="Rechercher un professionnel ou une spécialité..."><div class="chips" style="margin-top:10px"><span class="chip">Tous</span><span class="chip">Massage</span><span class="chip">Nutrition</span><span class="chip">Médecine</span><span class="chip">Pharmacie</span></div><div class="card"><div class="list"><div class="avatar">👩🏾</div><div><b>Professionnel partenaire</b><div class="small">Massage & bien-être</div><div class="rating">★ 4.8 · <span class="pill-ok">Profil vérifié</span></div></div></div><p class="small">Le badge est réservé aux profils dont les justificatifs requis ont été contrôlés.</p><button class="btn secondary" onclick="go('professional')">Voir le profil</button><button class="btn" onclick="go('booking')">Prendre rendez-vous</button></div><div class="card"><div class="list"><div class="avatar">👨🏾</div><div><b>Professionnel de santé</b><div class="small">Disponibilité à confirmer</div></div></div></div>`,`wellness`)}
function professional(){base(`<div class="top"><button class="back" onclick="go('professionals')">‹</button><span class="small">Profil professionnel</span></div><div class="card"><div class="list"><div class="avatar">👩🏾</div><div><h2 style="margin:0">Professionnel partenaire</h2><div class="small">Massage & bien-être</div><span class="pill-ok">Profil vérifié</span></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><b>Qualifications</b><p class="sub">Documents contrôlés selon les critères du pays et du service.</p><b>Services</b><p class="sub">Massage bien-être · relaxation</p><b>Disponibilités</b><p class="sub">Aujourd'hui · demain</p></div><button class="btn" onclick="go('booking')">Prendre rendez-vous</button>`,`wellness`)}
function booking(){base(`<div class="top"><button class="back" onclick="go('professionals')">‹</button><span class="small">Réservation</span></div><div class="h1">Réserver une séance</div><div class="card"><b>Service</b><select><option>Massage bien-être</option><option>Relaxation</option></select><div class="chips" style="margin-top:12px"><span class="chip">30 min</span><span class="chip">60 min</span><span class="chip">90 min</span></div></div><div class="card"><b>Date</b><input id="date" type="date" value="2026-09-20"><b style="display:block;margin-top:12px">Heure</b><select id="time"><option>09:00</option><option>11:00</option><option>15:00</option><option>17:00</option></select></div><div class="card"><b>Lieu</b><label class="option"><span>Centre</span><input type="radio" name="l" checked></label><label class="option"><span>À domicile</span><input type="radio" name="l"></label></div><button class="btn" onclick="confirmBooking()">Vérifier et confirmer</button><div class="footer-note">En production, la confirmation dépendra de la disponibilité réelle, des règles locales et, si applicable, du paiement.</div>`,`wellness`)}
function confirmBooking(){state.booking=true;openModal('<h2>✓ Demande enregistrée</h2><p class="sub">Prototype : la réservation est créée comme demande. Le backend devra confirmer la disponibilité avant confirmation définitive.</p><button class="btn" onclick="closeModal();go(\'home\')">Terminer</button>')}
function education(){base(`<div class="top"><div><div class="title">📚 Éducation santé</div><div class="sub">Contenus avec sources et date de révision</div></div></div><div class="card"><span class="pill-ok">Contenu vérifié</span><h3>Comprendre la prévention</h3><p class="sub">Article pédagogique. Auteur, sources et date de revue seront visibles.</p><button class="btn secondary">Lire</button></div><div class="card"><span class="pill-pending">À réviser</span><h3>Santé naturelle</h3><p class="sub">Un contenu ne doit pas être publié avant validation du workflow scientifique.</p></div>`,`home`)}
function profile(){base(`<div class="top"><div><div class="title">👤 Mon profil</div><div class="sub">Compte, données et sécurité</div></div></div><div class="card"><div class="list"><div class="avatar">👤</div><div><b>Utilisateur AMKOVie</b><div class="small">${state.country} · ${state.lang}</div></div></div></div>${[['Mes objectifs','go(\'health\')'],['Mes données santé','go(\'health\')'],['Mes rendez-vous','go(\'booking\')'],['Confidentialité','go(\'privacy\')'],['Espace professionnel','go(\'proLogin\')']].map(x=>`<button class="option" style="width:100%;border:1px solid var(--line);cursor:pointer" onclick="${x[1]}"><span>${x[0]}</span><span>›</span></button>`).join('')}<button class="btn secondary" onclick="openModal('<h2>Exporter mes données</h2><p class=\'sub\'>En production : génération d’un export structuré des données autorisées.</p><button class=\'btn\' onclick=\'closeModal()\'>Fermer</button>')">Exporter mes données</button><button class="btn danger" onclick="openModal('<h2>Suppression du compte</h2><p class=\'sub\'>Cette action sera irréversible après la période de conservation légalement requise, le cas échéant.</p><button class=\'btn danger\' onclick=\'closeModal()\'>Annuler</button>')">Supprimer mon compte</button>`,`profile`)}
function privacy(){base(`<div class="top"><button class="back" onclick="go('profile')">‹</button><span class="small">Confidentialité</span></div><div class="h1">🔐 Vos données</div><div class="card"><b>Minimisation</b><p class="sub">AMKOVie doit collecter uniquement les données nécessaires aux fonctions activées.</p></div><div class="card"><b>Contrôle utilisateur</b><p class="sub">Accès, export, rectification et suppression doivent être prévus selon le droit applicable.</p></div><div class="card"><b>Partage</b><p class="sub">Les données ne doivent pas être partagées avec un professionnel ou un partenaire sans base légale/consentement approprié.</p></div><div class="warning">Avant déploiement, AMKOVie devra faire valider son architecture de données et ses obligations réglementaires dans chaque marché ciblé.</div>`,`profile`)}
function proLogin(){base(`<div class="top"><button class="back" onclick="go('profile')">‹</button><span class="small">Professionnels</span></div><div class="h1">Espace professionnel</div><p class="sub">Pour praticiens et professionnels autorisés, selon les règles du pays.</p><button class="btn" onclick="go('proDashboard')">Démo tableau de bord</button><button class="btn secondary" onclick="openModal('<h2>Vérification professionnelle</h2><p class=\'sub\'>En production : identité, qualification, autorisation ou numéro professionnel, documents et statut de vérification.</p><button class=\'btn\' onclick=\'closeModal()\'>Compris</button>')">Voir le processus de vérification</button>`,`profile`)}
function proDashboard(){base(`<div class="top"><div><div class="title">Espace professionnel</div><div class="sub">Tableau de bord</div></div><span class="pill-ok">Vérifié</span></div><div class="grid"><div class="metric">📅 Rendez-vous<b>5</b><span class="small">aujourd'hui</span></div><div class="metric">💬 Messages<b>3</b><span class="small">non lus</span></div><div class="metric">⭐ Avis<b>4.8</b><span class="small">sur 5</span></div><div class="metric">👥 Clients<b>28</b><span class="small">ce mois</span></div></div><div class="card"><h3>Agenda</h3><p>09:00 · Client confirmé</p><p>11:30 · Disponible</p><p>15:00 · Client confirmé</p><button class="btn secondary">Gérer mes disponibilités</button></div><div class="card"><h3>Profil & documents</h3><p class="small">Statut de vérification, qualifications, services et zones d'exercice.</p><button class="btn secondary">Gérer le profil</button></div>`,`profile`)}
function admin(){base(`<div class="top"><div><div class="title">AMKOVie Admin</div><div class="sub">Gouvernance, contenu et sécurité</div></div></div><div class="grid">${['Utilisateurs','Professionnels','Plantes','Contenus','Sources','Signalements','IA','Sécurité'].map(x=>`<div class="card"><b>${x}</b><p class="small">Gestion</p></div>`).join('')}</div><div class="card"><h3>File scientifique</h3><p>🌿 Moringa · révision requise</p><p>🌿 Neem · révision requise</p><p>📚 Article · validation requise</p><button class="btn">Ouvrir la file</button></div>`,`profile`)}
function openAI(){openModal(`<h2>✨ Assistant AMKOVie</h2><p class="sub">Assistant d’information et d’accompagnement. Il ne remplace pas un professionnel de santé et ne doit pas inventer de données.</p><div class="option" onclick="aiFill('Que faut-il savoir sur une plante ?')">🌿 Explorer une plante <span>›</span></div><div class="option" onclick="aiFill('Je veux comprendre une information santé.')">❓ Comprendre une information santé <span>›</span></div><div class="option" onclick="aiFill('Aide-moi à préparer mes questions pour un professionnel.')">👨‍⚕️ Préparer un rendez-vous <span>›</span></div><div class="option" onclick="aiFill('Je pense avoir besoin d’une aide urgente.')">⚠️ Situation urgente <span>›</span></div><input id="aiq" placeholder="Écrivez votre question..."><button class="btn" onclick="submitAI()">Analyser</button><div id="airesp"></div>`)}
function aiFill(q){document.getElementById('aiq').value=q}
function submitAI(){const q=(document.getElementById('aiq').value||'').trim();const urgent=/urgence|urgent|douleur intense|difficulté à respirer|perte de connaissance|saignement important/i.test(q);document.getElementById('airesp').innerHTML=`<div class="${urgent?'dangerbox':'card'}"><b>${urgent?'⚠️ Orientation urgente':'Mode sécurisé AMKOVie'}</b><p class="sub">${urgent?'Si vous pensez être face à une urgence, contactez immédiatement les services d’urgence locaux ou un établissement de santé.':'Votre question sera traitée, en production, par une couche de connaissances validées, un moteur de sécurité, des règles pays et une politique d’orientation.'}</p><div class="warning">L'IA ne doit pas poser seule un diagnostic, prescrire, recommander l'arrêt d'un traitement ou présenter une information incertaine comme un fait.</div></div>`}
function openModal(html){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" style="float:right" onclick="closeModal()">×</button>${html}</div>`}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
go('splash');
</script>
</body></html>
