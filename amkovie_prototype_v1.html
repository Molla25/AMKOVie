<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMKOVie — Prototype fonctionnel V1</title>
<style>
:root{--green:#087a5b;--green2:#0e9b73;--ink:#17312b;--muted:#64756f;--bg:#f5faf8;--card:#fff;--line:#dfeae6;--danger:#b42318;--soft:#e9f7f1}
*{box-sizing:border-box}body{margin:0;background:#dfe9e5;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.app{width:min(430px,100vw);height:100vh;min-height:760px;margin:auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 30px #0002}.status{height:28px;padding:7px 18px 0;font-size:12px;display:flex;justify-content:space-between}.screen{flex:1;overflow:auto;padding:18px 18px 88px}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.title{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:14px;line-height:1.45}.logo{font-size:32px;font-weight:900;letter-spacing:-1.5px;color:var(--green)}.hero{text-align:center;padding:45px 20px 30px}.leaf{font-size:54px}.tag{display:inline-block;background:var(--soft);color:var(--green);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--green);color:#fff;font-weight:800;font-size:15px;margin-top:12px}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #0c5c4510}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border-radius:15px;background:#fff;border:1px solid var(--line)}.metric b{display:block;font-size:20px;margin-top:5px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px}.search{display:flex;gap:8px}.search input,input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;font-size:14px}.plant{overflow:hidden;padding:0}.plant .pic{height:105px;background:linear-gradient(135deg,#d7ead5,#edf6e8);display:flex;align-items:center;justify-content:center;font-size:52px}.plant .body{padding:14px}.bar{height:7px;border-radius:20px;background:#e3eee9;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:62%}.tabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}.tabs button{border:0;background:transparent;padding:12px 8px;color:var(--muted);white-space:nowrap}.tabs button.active{color:var(--green);font-weight:800;border-bottom:2px solid var(--green)}.warning{background:#fff5df;border:1px solid #f2d99a;color:#76520a;border-radius:14px;padding:13px;font-size:13px;line-height:1.4}.dangerbox{background:#fff0ef;border:1px solid #f1c2be;color:#8d1f17;border-radius:14px;padding:13px;font-size:13px;line-height:1.4}.nav{height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);position:absolute;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;color:#687a74;font-size:10px}.nav button.active{color:var(--green);font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}.fab{position:absolute;right:16px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#fff;font-weight:900;box-shadow:0 8px 22px #087a5b55}.list{display:flex;gap:12px;align-items:center}.avatar{width:50px;height:50px;border-radius:50%;background:#d9ece5;display:grid;place-items:center;font-size:24px}.small{font-size:12px;color:var(--muted)}.rating{color:#b47a00;font-size:12px}.modal{position:absolute;inset:0;background:#10201b66;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:80%;overflow:auto}.close{float:right;border:0;background:#eef5f2;border-radius:50%;width:34px;height:34px}.option{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;display:flex;justify-content:space-between}.check{accent-color:var(--green)}
</style></head>
<body>
<div class="app">
<div class="status"><span>9:41</span><span>▮▮▮　Wi‑Fi　▰</span></div>
<div id="screen" class="screen"></div>
<button id="fab" class="fab" onclick="openAI()">AI</button>
<nav class="nav">
<button onclick="go('home')" data-nav="home"><span>⌂</span>Accueil</button>
<button onclick="go('health')" data-nav="health"><span>♡</span>Santé</button>
<button onclick="go('nature')" data-nav="nature"><span>♧</span>Nature</button>
<button onclick="go('wellness')" data-nav="wellness"><span>♧</span>Bien-être</button>
<button onclick="go('profile')" data-nav="profile"><span>♙</span>Profil</button>
</nav>
<div id="modal" class="modal hidden"></div>
</div>
<script>
const S=document.getElementById('screen');
function nav(active){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===active))}
function go(page){
 document.getElementById('fab').style.display=page==='splash'||page==='onboard'?'none':'block';
 const pages={splash, welcome,onboard,home,health,nature,plant,safety,wellness,professionals,booking,profile};
 (pages[page]||home)();
}
function base(html,active='home'){S.innerHTML=html;nav(active)}
function splash(){nav('');S.innerHTML=`<div class="hero"><div class="leaf">🌿</div><div class="logo">AMKOVie</div><h2>Your Health.<br>Your Well-being.<br>Your Life.</h2><p class="sub">Connecting modern health, natural care & wellness.</p><button class="btn" onclick="go('welcome')">Commencer</button></div>`}
function welcome(){S.innerHTML=`<div class="hero"><span class="tag">Plateforme santé intégrative</span><h1>Bienvenue sur AMKOVie</h1><p class="sub">Votre santé mérite une approche globale, simple et personnalisée.</p><div class="grid" style="margin-top:25px"><div class="card">🛡️<br><b>Prévention</b><br><span class="small">Habitudes et suivi</span></div><div class="card">🌿<br><b>Nature</b><br><span class="small">Information vérifiée</span></div><div class="card">🥗<br><b>Nutrition</b><br><span class="small">Éducation santé</span></div><div class="card">🤲<br><b>Bien-être</b><br><span class="small">Massage & relaxation</span></div></div><button class="btn" onclick="go('onboard')">Créer mon profil</button><button class="btn secondary" onclick="go('home')">Continuer en invité</button></div>`}
function onboard(){S.innerHTML=`<div class="top"><button class="close" onclick="go('welcome')">‹</button><span class="small">1/4</span></div><h1>Vos objectifs de santé</h1><p class="sub">Sélectionnez ce que vous souhaitez suivre. Vous pourrez modifier vos choix.</p>${['Prévention générale','Alimentation / Nutrition','Sommeil','Activité physique','Santé naturelle','Bien-être'].map((x,i)=>`<label class="option"><span>${x}</span><input class="check" type="checkbox" ${[0,1,4].includes(i)?'checked':''}></label>`).join('')}<button class="btn" onclick="go('home')">Continuer</button>`}
function home(){base(`<div class="top"><div><div class="title">Bonjour 👋</div><div class="sub">Comment allez-vous aujourd'hui ?</div></div><div class="avatar">🙂</div></div><div class="chips"><span class="chip">😊 Très bien</span><span class="chip">🙂 Bien</span><span class="chip">😐 Moyen</span><span class="chip">😟 Pas très bien</span></div><h3>Mon jour</h3><div class="grid"><div class="metric">💧 Hydratation<b>4 / 8</b><span class="small">verres</span><div class="bar"><i style="width:50%"></i></div></div><div class="metric">😴 Sommeil<b>7 h 12</b><span class="small">Qualité : bonne</span><div class="bar"><i style="width:78%"></i></div></div><div class="metric">🚶 Activité<b>5 240</b><span class="small">pas</span><div class="bar"><i style="width:62%"></i></div></div><div class="metric">🧘 Bien-être<b>10 min</b><span class="small">relaxation</span><div class="bar"><i style="width:50%"></i></div></div></div><div class="card"><b>🌿 Recommandation du jour</b><p class="sub">Découvrez une fiche de plante avec ses usages rapportés, données disponibles et précautions.</p><button class="btn" onclick="go('nature')">Explorer</button></div>`,`home`)}
function health(){base(`<div class="top"><div><div class="title">♡ Ma santé</div><div class="sub">Votre suivi personnel</div></div></div><div class="card"><h3>Mes objectifs</h3><p>💧 Hydratation</p><div class="bar"><i style="width:65%"></i></div><p>😴 Sommeil</p><div class="bar"><i style="width:72%"></i></div><p>🚶 Activité</p><div class="bar"><i style="width:48%"></i></div></div><div class="card"><h3>Mes données</h3><div class="grid"><button class="btn secondary">Sommeil</button><button class="btn secondary">Hydratation</button><button class="btn secondary">Activité</button><button class="btn secondary">Nutrition</button></div></div><div class="warning">AMKOVie présente vos données de suivi. Elles ne constituent pas, à elles seules, un diagnostic médical.</div>`,`health`)}
function nature(){base(`<div class="top"><div><div class="title">🌿 Santé naturelle</div><div class="sub">Informations structurées et précautions</div></div></div><div class="search"><input placeholder="Rechercher une plante ou un sujet..."><button class="btn" style="width:52px;margin:0" onclick="go('plant')">⌕</button></div><div class="chips" style="margin-top:12px"><span class="chip">Plantes</span><span class="chip">Nutrition</span><span class="chip">Préparations</span><span class="chip">Traditions</span><span class="chip">Sécurité</span></div><h3>Plantes populaires</h3><div class="grid">${[['🌿','Moringa','Moringa oleifera'],['🍃','Neem','Azadirachta indica'],['🫚','Gingembre','Zingiber officinale'],['🟠','Curcuma','Curcuma longa']].map(p=>`<div class="card plant" onclick="go('plant')"><div class="pic">${p[0]}</div><div class="body"><b>${p[1]}</b><div class="small">${p[2]}</div><span class="tag">Fiche structurée</span></div></div>`).join('')}</div>`,`nature`)}
function plant(){base(`<div class="top"><button class="close" onclick="go('nature')">‹</button><button class="close">♡</button></div><div class="card plant"><div class="pic">🌿</div><div class="body"><h1 style="margin:0">Moringa</h1><i>Moringa oleifera</i><p><span class="tag">Niveau à confirmer selon la source</span></p><div class="tabs"><button class="active">Vue d'ensemble</button><button>Tradition</button><button>Science</button><button>Sécurité</button></div><h3>Identité</h3><p class="sub">Nom scientifique : Moringa oleifera<br>Nom courant : Moringa<br>Famille botanique : à renseigner</p><div class="warning"><b>Usage traditionnel</b><br>Présenter ici les usages traditionnellement rapportés, séparément des conclusions scientifiques.</div><h3>Données scientifiques</h3><p class="sub">Afficher uniquement les données issues de sources identifiables, avec niveau de preuve et date de revue.</p><button class="btn" onclick="go('safety')">Voir la sécurité avant utilisation</button></div></div>`,`nature`)}
function safety(){base(`<div class="top"><button class="close" onclick="go('plant')">‹</button><span class="small">Sécurité</span></div><h1>⚠️ Vérification</h1><p class="sub">Ces questions permettent d'afficher des précautions adaptées. Elles ne remplacent pas un professionnel de santé.</p><div class="card"><b>Prenez-vous actuellement des médicaments ?</b><div class="grid"><button class="btn secondary">Oui</button><button class="btn">Non</button></div></div><div class="card"><b>Avez-vous une allergie connue ?</b><div class="grid"><button class="btn secondary">Oui</button><button class="btn">Non</button></div></div><div class="card"><b>Grossesse / allaitement ?</b><div class="grid"><button class="btn secondary">Oui</button><button class="btn">Non</button></div></div><div class="dangerbox">En présence d'un risque ou d'une information insuffisante, AMKOVie doit orienter vers un professionnel plutôt que fournir une recommandation autonome.</div><button class="btn" onclick="go('plant')">Continuer</button>`,`nature`)}
function wellness(){base(`<div class="top"><div><div class="title">🤲 Bien-être</div><div class="sub">Prenez soin de votre corps et de votre équilibre</div></div></div><div class="card" style="background:linear-gradient(135deg,#e7f5ef,#fff)"><h2>Massage & soins complémentaires</h2><p class="sub">Découvrez des services de bien-être et trouvez des professionnels selon les règles applicables.</p><button class="btn" onclick="go('professionals')">Trouver un professionnel</button></div><div class="grid"><div class="card">🧘<br><b>Relaxation</b><br><span class="small">Respiration et détente</span></div><div class="card">🌬️<br><b>Respiration</b><br><span class="small">Exercices guidés</span></div><div class="card">🤲<br><b>Massage</b><br><span class="small">Bien-être corporel</span></div><div class="card">🏃<br><b>Récupération</b><br><span class="small">Après l'effort</span></div></div><div class="card"><b>Réserver une séance</b><p class="sub">Choisissez un service, une durée, une date et un professionnel.</p><button class="btn secondary" onclick="go('booking')">Réserver</button></div>`,`wellness`)}
function professionals(){base(`<div class="top"><div><div class="title">Professionnels</div><div class="sub">Des profils qualifiés, vérifiés selon les critères définis par AMKOVie.</div></div></div><input placeholder="Rechercher un professionnel ou une spécialité..."><div class="chips" style="margin-top:10px"><span class="chip">Tous</span><span class="chip">Massage</span><span class="chip">Nutrition</span><span class="chip">Médecine</span><span class="chip">Pharmacie</span></div><div class="card"><div class="list"><div class="avatar">👩🏾</div><div><b>Professionnel partenaire</b><div class="small">Massage & bien-être</div><div class="rating">★ 4.8 · Profil vérifié</div></div></div><p class="small">Les qualifications, autorisations et documents doivent être vérifiés avant l'affichage d'un badge.</p><button class="btn" onclick="go('booking')">Prendre rendez-vous</button></div><div class="card"><div class="list"><div class="avatar">👨🏾</div><div><b>Professionnel de santé</b><div class="small">Profil à compléter</div></div></div></div>`,`wellness`)}
function booking(){base(`<div class="top"><button class="close" onclick="go('professionals')">‹</button><span class="small">Réservation</span></div><h1>Réserver une séance</h1><div class="card"><b>Service</b><p>Massage bien-être</p><div class="chips"><span class="chip">30 min</span><span class="chip">60 min</span><span class="chip">90 min</span></div></div><div class="card"><b>Date</b><input type="date" value="2026-09-20"><b style="display:block;margin-top:12px">Heure</b><select><option>09:00</option><option>11:00</option><option>15:00</option><option>17:00</option></select></div><div class="card"><b>Lieu</b><label class="option"><span>Centre</span><input type="radio" name="l" checked></label><label class="option"><span>À domicile</span><input type="radio" name="l"></label></div><button class="btn" onclick="alert('Prototype : réservation enregistrée. En production, le backend devra confirmer la disponibilité et le paiement.')">Confirmer la réservation</button>`,`wellness`)}
function profile(){base(`<div class="top"><div><div class="title">👤 Mon profil</div><div class="sub">Gérez votre compte et vos données</div></div></div><div class="card"><div class="list"><div class="avatar">👤</div><div><b>Utilisateur AMKOVie</b><div class="small">Compte personnel</div></div></div></div>${['Mes objectifs','Mes données santé','Mes rendez-vous','Mes favoris','Confidentialité et sécurité','Langue & notifications','Exporter mes données','Supprimer mon compte'].map(x=>`<div class="option"><span>${x}</span><span>›</span></div>`).join('')}<div class="warning">Les fonctions de données de santé devront être soumises aux exigences juridiques applicables dans chaque pays cible avant déploiement.</div>`,`profile`)}
function openAI(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" style="float:right" onclick="closeAI()">×</button><h2>✨ Assistant AMKOVie</h2><p class="sub">Je peux expliquer des informations santé, organiser vos habitudes et vous aider à préparer une consultation. Je ne remplace pas un professionnel de santé.</p><div class="option" onclick="ask('plante')">🌿 Explorer une plante <span>›</span></div><div class="option" onclick="ask('question')">❓ Comprendre une information santé <span>›</span></div><div class="option" onclick="ask('rendezvous')">👨‍⚕️ Préparer un rendez-vous <span>›</span></div><div class="option" onclick="ask('urgence')">⚠️ Situation urgente <span>›</span></div><input id="aiq" placeholder="Écrivez votre question..."><button class="btn" onclick="submitAI()">Envoyer</button><div id="airesp"></div></div>`}
function closeAI(){document.getElementById('modal').classList.add('hidden')}
function ask(t){document.getElementById('aiq').value=t==='plante'?'Que faut-il savoir sur une plante ?':t==='rendezvous'?'Aide-moi à préparer mes questions pour un professionnel.':t==='urgence'?'Je pense avoir besoin d’une aide urgente.':'Je veux comprendre une information de santé.'}
function submitAI(){const q=document.getElementById('aiq').value;document.getElementById('airesp').innerHTML=`<div class="card"><b>Mode sécurisé AMKOVie</b><p class="sub">Question reçue : ${q||'—'}</p><p>En production, la réponse passera par la base de connaissances validée, le moteur de sécurité, les règles pays et, si nécessaire, une orientation vers un professionnel.</p><div class="warning">L'IA ne doit pas inventer de propriétés médicinales, poser un diagnostic ou recommander l'arrêt d'un traitement.</div></div>`}
go('splash');
</script></body></html>
